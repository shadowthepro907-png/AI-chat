<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a}
header{padding:14px 18px;font-weight:700;background:#4f46e5;color:#fff}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.4}
.me{align-self:flex-end;background:#4f46e5;color:#fff}
.ai{align-self:flex-start;background:#fff;border:1px solid #e2e8f0}
#f{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e2e8f0}
input{flex:1;padding:12px 16px;border:1px solid #cbd5e1;border-radius:999px;font-size:16px;outline:none}
button{padding:0 20px;border:0;border-radius:999px;background:#4f46e5;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header>💬 Chat AI</header>
<div id="msgs"><div class="m ai">Hi! Ask me anything.</div></div>
<div id="f"><input id="inp" placeholder="Type your question…" autocomplete="off"><button id="go" type="button">Send</button></div>
<script>
// PASTE YOUR CLOUDFLARE WORKER URL BETWEEN THE QUOTES:
const WORKER_URL="";

const msgs=document.getElementById("msgs"),inp=document.getElementById("inp");
let history=[],busy=false;
function add(cls,t){const d=document.createElement("div");d.className="m "+cls;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
async function send(){
  const t=inp.value.trim();if(!t||busy)return;
  inp.value="";add("me",t);history.push({role:"user",content:t});
  const b=add("ai","…");busy=true;
  try{
    const r=await fetch(WORKER_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Request failed");
    b.textContent=d.reply;history.push({role:"assistant",content:d.reply});
  }catch(err){b.textContent="Error: "+err.message;history.pop()}
  busy=false;
}
document.getElementById("go").addEventListener("click",send);
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
</script>
</body>
</html>
